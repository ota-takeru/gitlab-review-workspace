name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout released version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Validate released version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne "${{ needs.release-please.outputs.version }}") {
            throw "package.json version '$version' does not match Release Please version '${{ needs.release-please.outputs.version }}'."
          }

      - name: Package VSIX
        shell: pwsh
        run: npx --yes @vscode/vsce@3.9.2 package --out "gitlab-review-workspace-${{ needs.release-please.outputs.version }}.vsix"

      - name: Attach VSIX to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          "gitlab-review-workspace-${{ needs.release-please.outputs.version }}.vsix"
          --clobber
          --repo "${{ github.repository }}"

      - name: Publish to Visual Studio Marketplace
        shell: pwsh
        run: >-
          npx --yes @vscode/vsce@3.9.2 publish
          --oidc
          --skip-duplicate
          --packagePath "gitlab-review-workspace-${{ needs.release-please.outputs.version }}.vsix"
