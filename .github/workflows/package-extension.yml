name: Package VS Code extension

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out gitlab-review-workspace.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-review-workspace-vsix
          path: gitlab-review-workspace.vsix
          if-no-files-found: error
