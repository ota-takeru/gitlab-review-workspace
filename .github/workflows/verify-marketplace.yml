name: Verify Marketplace identity

on:
  workflow_dispatch:
    inputs:
      verify_publisher:
        description: Verify publisher access after adding the identity as a Contributor
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate identity configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "::error::AZURE_CLIENT_ID is missing"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "::error::AZURE_TENANT_ID is missing"; exit 1; }

      - name: Sign in with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Identify Marketplace service principal
        run: |
          profile_id="$(az rest --method get \
            --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query id --output tsv --only-show-errors)"
          [[ "$profile_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::No valid Marketplace identity ID returned"; exit 1; }
          printf 'Marketplace service principal ID: %s\n' "$profile_id"
          printf 'Marketplace service principal ID: `%s`\n' "$profile_id" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: inputs.verify_publisher
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify publisher access without publishing
        if: inputs.verify_publisher
        run: npx --yes @vscode/vsce@3.9.2 verify-pat ota-takeru --azure-credential
