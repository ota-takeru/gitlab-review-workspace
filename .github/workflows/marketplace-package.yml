name: Marketplace package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx --yes @vscode/vsce package --out gitlab-review-workspace.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: gitlab-review-workspace-marketplace
          path: gitlab-review-workspace.vsix
          if-no-files-found: error
